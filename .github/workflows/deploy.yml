name: Test and Deploy Velocity Apex V76
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test V76
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download the project
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright WebKit and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Run mobile case roulette visual regression
        run: npm run test:cases:mobile
        env:
          CASE_SCREENSHOT_DIR: artifacts/case-v7631
      - name: Upload mobile case screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-roulette-v7631-webkit
          path: artifacts/case-v7631/
          if-no-files-found: ignore
      - name: Check server and mobile navigation tests
        run: npm test && npm run test:v74
  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the project
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Publish Cloudflare Worker and PWA
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
