name: Deploy Velocity Apex V65
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    name: Test and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download the project
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check server and mobile navigation tests
        run: npm test && npm run test:v65
      - name: Publish Cloudflare Worker and PWA
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
