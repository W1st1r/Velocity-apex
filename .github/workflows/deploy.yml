name: Test Velocity Apex V77
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test V76
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download the project
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright WebKit and system dependencies
        run: npx playwright install --with-deps webkit
      - name: Test account recovery in mobile Safari emulation
        run: node tests/account_recovery_mobile_webkit_test.mjs
      - name: Reuse unchanged successful case visual checks
        id: case-visual-cache
        uses: actions/cache@v4
        with:
          path: artifacts/case-v7632
          key: case-webkit-v1-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'tests/case_results_v763_mobile.mjs', 'public/css/style.css', 'public/css/mobile-ui.css', 'public/css/cases-v763.css', 'public/js/content.js', 'public/js/garage.js') }}
      - name: Run mobile case roulette visual regression
        if: steps.case-visual-cache.outputs.cache-hit != 'true'
        run: npm run test:cases:mobile
        env:
          CASE_SCREENSHOT_DIR: artifacts/case-v7632
      - name: Upload mobile case screenshots
        if: always() && steps.case-visual-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: case-header-v7632-webkit
          path: artifacts/case-v7632/
          if-no-files-found: ignore
      - name: Verify Worker bundle without deployment
        run: npx wrangler deploy --dry-run --outdir /tmp/v77-worker-build
      - name: Verify server-authoritative race sessions
        run: npm run test:race:authority
      - name: Verify race start and connection recovery in WebKit
        run: npm run test:race:mobile
        env:
          RACE_SCREENSHOT_DIR: artifacts/race-v77
      - name: Upload V77 race screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-authority-v77-webkit
          path: artifacts/race-v77/
          if-no-files-found: ignore
      - name: Check server and mobile navigation tests
        run: npm test && npm run test:v74
      - name: Calibrate AI across vehicles and upgrades
        run: npm run test:ai
      - name: Verify D1 backup, restore and migration safety
        run: npm run test:d1-release
