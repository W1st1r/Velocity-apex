name: V77 Cloudflare read-only preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify token, account, D1, and Worker metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const databaseId = "dee1721c-9730-4780-9185-7b23666333b2";
          const databaseName = "velocity-apex-db";
          const workerName = "velocity-apex";
          const summaryFile = process.env.GITHUB_STEP_SUMMARY;

          async function request(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              method: "GET",
              headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
            });
            let payload;
            try { payload = await response.json(); } catch {}
            return { response, payload };
          }

          function requireSuccess(result, label) {
            if (!result.response.ok || result.payload?.success !== true) {
              throw new Error(`${label} failed (HTTP ${result.response.status}); response details withheld`);
            }
            return result.payload.result;
          }

          async function main() {
            if (!token || !accountId) throw new Error("Required repository secret is missing");
            if (!/^[0-9a-f]{32}$/i.test(accountId)) throw new Error("Account ID has an invalid format");

            const verification = requireSuccess(await request("/user/tokens/verify"), "Cloudflare token verification");
            if (verification?.status !== "active") throw new Error("Cloudflare token is not active");
            console.log("Cloudflare API token: active");

            const database = requireSuccess(
              await request(`/accounts/${accountId}/d1/database/${databaseId}`),
              "D1 metadata read",
            );
            if (database?.uuid !== databaseId || database?.name !== databaseName) {
              throw new Error("D1 metadata did not match the expected database");
            }
            console.log("Account ID and production D1 metadata: confirmed by read-only API");

            let workerStatus = "unavailable";
            const workerResult = await request(`/accounts/${accountId}/workers/scripts?per_page=100`);
            if (workerResult.response.status === 403) {
              console.log("Worker metadata: not readable with this token (read scope unavailable)");
            } else {
              const scripts = requireSuccess(workerResult, "Worker metadata read");
              const found = Array.isArray(scripts) && scripts.some(script => script?.id === workerName);
              if (!found) throw new Error("Expected Worker metadata was not found in this account");
              workerStatus = "readable";
              console.log("Worker metadata: velocity-apex found");
            }

            const lines = [
              "## V77 Cloudflare read-only preflight",
              "",
              "- API token: active",
              "- Account ID: confirmed by D1 metadata response",
              "- Production D1: readable; UUID and name match",
              `- Worker metadata: ${workerStatus}`,
              "- Operations performed: GET requests only; no SQL, backup, migration, or deployment",
            ];
            await import("node:fs/promises").then(fs => fs.appendFile(summaryFile, lines.join("\n") + "\n"));
          }

          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
