name: Protected rollback to V2.0.1
on:
  workflow_dispatch:
    inputs:
      target_version_id:
        description: Exact verified pre-V2.0.2 Worker version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: velocity-apex-production-release
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && inputs.target_version_id == '361ab350-a0eb-4fd9-afd1-19c551233fdb'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      TARGET_VERSION_ID: ${{ inputs.target_version_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Validate fixed target and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_VERSION_ID" = '361ab350-a0eb-4fd9-afd1-19c551233fdb'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Restore the previous Worker version only
        run: npx wrangler rollback "$TARGET_VERSION_ID" --name velocity-apex --message "Restore 2.0.1 after failed 2.0.2 production smoke" --config wrangler.jsonc
