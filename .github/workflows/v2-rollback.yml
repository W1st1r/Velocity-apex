name: Protected rollback to verified V2 versions
on:
  workflow_dispatch:
    inputs:
      target_version_id:
        description: Exact verified V2.0.1 or V2.0.2 Worker version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: velocity-apex-production-release
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && (inputs.target_version_id == '361ab350-a0eb-4fd9-afd1-19c551233fdb' || inputs.target_version_id == '78de7942-3b99-400e-b207-9778ef809f6e')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      TARGET_VERSION_ID: ${{ inputs.target_version_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Validate fixed target and credentials
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_VERSION_ID" in
            361ab350-a0eb-4fd9-afd1-19c551233fdb) echo 'ROLLBACK_MESSAGE=Restore V2.0.1 after failed V2.0.2 production smoke' >> "$GITHUB_ENV" ;;
            78de7942-3b99-400e-b207-9778ef809f6e) echo 'ROLLBACK_MESSAGE=Restore V2.0.2 after failed V2.0.3 production smoke' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Restore the previous Worker version only
        run: npx wrangler rollback "$TARGET_VERSION_ID" --name velocity-apex --message "$ROLLBACK_MESSAGE" --config wrangler.jsonc
