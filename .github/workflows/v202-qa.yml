name: V2.0.3 physics QA (no deployment)
on:
  push:
    branches: [fix/v203-restore-normal-physics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    if: "!contains(github.event.head_commit.message, '[ui qa]')"
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BASELINE_DIR: ../baseline
      STARTUP_REPEATS: '3'
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: fe9bbb0f23939892b99cece49f1fea9255f17f42
          path: baseline
      - run: npm ci --no-audit --no-fund
      - name: Check generated client/server simulation
        run: node scripts/build-race-runtime.mjs --check
      - name: Gameplay metrics, drift and independent replay
        run: npm run test:v203
      - name: Startup and reload in WebKit and Chromium
        run: node tests/frontend_startup_v201.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v203-physics-${{ github.run_id }}
          path: candidate/artifacts/
  visual:
    if: "contains(github.event.head_commit.message, '[ui qa]')"
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      BASELINE_DIR: ../baseline
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: fe9bbb0f23939892b99cece49f1fea9255f17f42
          path: baseline
      - run: npm ci --no-audit --no-fund
      - name: Before and after panel layouts in eight mobile browser profiles
        run: node tests/ui_polish_v202_mobile.mjs
        env:
          UI_SCREENS: clans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v203-visual-${{ github.run_id }}
          path: candidate/artifacts/
