name: Protected app-only release 2.0.3
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main SHA containing the reviewed V2.0.3 release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: velocity-apex-production-release
  cancel-in-progress: false
jobs:
  startup:
    if: github.ref == 'refs/heads/main' && inputs.release_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      STARTUP_ARTIFACTS: artifacts/startup-v203
      STARTUP_REPEATS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - name: Verify release identity and actual WebKit/Chromium startup
        run: |
          node tests/ui_version_v2_test.mjs
          node tests/frontend_startup_v201.mjs
      - name: Verify Worker package without deployment
        run: npx wrangler deploy --dry-run --outdir /tmp/v203-worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v203-startup-${{ github.run_id }}
          path: artifacts/startup-v203/
          retention-days: 30
          if-no-files-found: warn
  release:
    needs: startup
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - name: Check required credentials without printing values
        env:
          V77_SMOKE_USERNAME: ${{ secrets.V77_SMOKE_USERNAME }}
          V77_SMOKE_PASSWORD: ${{ secrets.V77_SMOKE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$V77_SMOKE_USERNAME"
          test -n "$V77_SMOKE_PASSWORD"
      - name: Preserve previous Worker deployment metadata
        run: npx wrangler deployments list --json > "$RUNNER_TEMP/worker-before-v203.json"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-before-v203-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-before-v203.json
          retention-days: 30
          if-no-files-found: error
      - name: Deploy application only — no D1 migrations
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify live login screen, assets and reload in WebKit/Chromium
        env:
          STARTUP_BASE_URL: https://velocity-apex.maximmanzha20.workers.dev
          STARTUP_ARTIFACTS: artifacts/startup-live-v203
          STARTUP_REPEATS: '3'
        run: node tests/frontend_startup_v201.mjs
      - name: Verify production API, test-account garage and Ghost Racing read
        env:
          V77_SMOKE_USERNAME: ${{ secrets.V77_SMOKE_USERNAME }}
          V77_SMOKE_PASSWORD: ${{ secrets.V77_SMOKE_PASSWORD }}
        run: node scripts/d1-release-safety.mjs smoke https://velocity-apex.maximmanzha20.workers.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v203-production-smoke-${{ github.run_id }}
          path: artifacts/startup-live-v203/
          retention-days: 30
          if-no-files-found: warn
      - name: Record app-only release and smoke result
        run: |
          echo "V2.0.3 app-only release smoke passed in WebKit iPhone 13/14/15/17 landscape and Chromium; profile, garage, Ghost Racing and authority gate verified. No D1 migrations executed." >> "$GITHUB_STEP_SUMMARY"
