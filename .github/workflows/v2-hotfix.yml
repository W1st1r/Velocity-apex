name: Protected frontend hotfix 2.0.1
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main SHA containing the reviewed startup hotfix
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: velocity-apex-production-release
  cancel-in-progress: false
jobs:
  startup:
    if: github.ref == 'refs/heads/main' && inputs.release_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - name: Verify DOM preservation and actual WebKit/Chromium startup
        run: |
          node tests/ui_version_v2_test.mjs
          node tests/frontend_startup_v201.mjs
      - name: Verify Worker package without deployment
        run: npx wrangler deploy --dry-run --outdir /tmp/v201-worker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotfix-201-startup-${{ github.run_id }}
          path: artifacts/startup-v201/
          retention-days: 30
          if-no-files-found: warn
  release:
    needs: startup
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - name: Preserve previous Worker deployment metadata
        run: npx wrangler deployments list --json > "$RUNNER_TEMP/worker-before-hotfix.json"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-before-hotfix-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-before-hotfix.json
          retention-days: 30
          if-no-files-found: error
      - name: Deploy application hotfix only (no D1 migration)
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify live login or menu in WebKit and Chromium
        env:
          STARTUP_BASE_URL: https://velocity-apex.maximmanzha20.workers.dev
          STARTUP_ARTIFACTS: artifacts/startup-live-v201
        run: node tests/frontend_startup_v201.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotfix-201-live-${{ github.run_id }}
          path: artifacts/startup-live-v201/
          retention-days: 30
          if-no-files-found: warn
      - name: Record successful frontend recovery
        run: echo '2.0.1 startup verified in WebKit iPhone 13/14/15/17 landscape and Chromium, including all linked CSS/JS, preserved DOM and reload. No D1 migrations executed.' >> "$GITHUB_STEP_SUMMARY"
