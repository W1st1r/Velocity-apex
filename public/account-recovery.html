<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080c12">
<title>Восстановление доступа — Velocity Apex</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));display:grid;place-items:center;background:#080c12;color:#eef3fa;font-family:Arial,sans-serif}.card{width:min(100%,520px);padding:clamp(22px,6vw,38px);background:#111923;border:1px solid #2a394a;border-radius:18px;box-shadow:0 20px 70px #0008}.brand{color:#b9ff43;letter-spacing:3px;font-size:13px;font-weight:800}h1{font-size:clamp(22px,5vw,30px);line-height:1.15;margin:24px 0 10px}p{line-height:1.6;color:#c3ccd8}.field{display:grid;gap:8px;margin:20px 0}.field span{font-size:12px;letter-spacing:1px;color:#aab5c3}.field input{width:100%;min-height:48px;padding:12px;border-radius:8px;border:1px solid #425064;background:#080c12;color:white;font-size:16px}.btn{width:100%;min-height:50px;border:0;border-radius:8px;background:#b9ff43;color:#111923;font-weight:bold;letter-spacing:1px;font-size:14px}.btn:disabled{opacity:.55}.message{min-height:24px;color:#dce5ef}.message.error{color:#ff8d8d}.back{display:inline-block;margin-top:18px;color:#b9ff43;text-decoration:none}.small{font-size:13px;color:#97a5b5}
</style>
</head>
<body><main class="card"><div class="brand">VELOCITY APEX / ACCOUNT SECURITY</div><h1 id="title">ВОССТАНОВЛЕНИЕ ДОСТУПА</h1><p id="intro">Защитите аккаунт и игровые сохранения.</p><form id="form" hidden><label class="field"><span>НОВЫЙ ПАРОЛЬ</span><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><label class="field"><span>ПОВТОРИТЕ ПАРОЛЬ</span><input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><button id="submit" class="btn" type="submit">СМЕНИТЬ ПАРОЛЬ</button></form><p id="message" class="message" aria-live="polite"></p><p class="small">Ссылка одноразовая и действует 20 минут. Если вы не запрашивали это письмо, закройте страницу. Если доступ к email потерян, обратитесь в официальную поддержку проекта.</p><a class="back" href="/">← ВЕРНУТЬСЯ В ИГРУ</a></main><script src="/js/account-recovery-page.js?v=v77-recovery-1"></script></body></html>
